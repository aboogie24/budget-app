name: Release API

# Manually triggered: you choose whether this release is a patch, minor,
# or major bump. Versions are derived from git tags (vMAJOR.MINOR.PATCH);
# the first release from a tagless repo is v0.0.1.
#
#   patch — bug fixes, no behavior change callers must care about
#   minor — new endpoints/features, backwards compatible
#   major — breaking API changes (removed/renamed endpoints, changed shapes)
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump for this release"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Compute the version and build, but do not tag/push/release"
        type: boolean
        default: false

concurrency:
  group: release-api
  cancel-in-progress: false

permissions:
  contents: write # push tag + create release
  packages: write # push image to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}/api

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: budget-backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so all tags are visible

      - name: Compute next version
        id: version
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "${{ inputs.bump }}" in
            major) next="v$((major + 1)).0.0" ;;
            minor) next="v${major}.$((minor + 1)).0" ;;
            patch) next="v${major}.${minor}.$((patch + 1))" ;;
          esac
          echo "Latest: ${latest} → Next: ${next} (${{ inputs.bump }})"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "next=${next}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        with:
          go-version-file: budget-backend/go.mod
          cache-dependency-path: budget-backend/go.sum

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: budget-backend
          platforms: linux/amd64,linux/arm64
          push: ${{ !inputs.dry_run }}
          build-args: |
            VERSION=${{ steps.version.outputs.next }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.next }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package Helm chart
        id: chart
        run: |
          next="${{ steps.version.outputs.next }}"
          # Chart version = API version without the leading v; appVersion =
          # the release tag, which the chart uses as the default image tag.
          helm package chart \
            --version "${next#v}" \
            --app-version "${next}" \
            --destination dist
          echo "tgz=budget-backend/dist/budget-api-${next#v}.tgz" >> "$GITHUB_OUTPUT"

      - name: Push Helm chart to GHCR
        if: ${{ !inputs.dry_run }}
        run: |
          next="${{ steps.version.outputs.next }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/budget-api-${next#v}.tgz" \
            "oci://ghcr.io/${{ github.repository }}/charts"

      - name: Tag and create release
        if: ${{ !inputs.dry_run }}
        working-directory: .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.version.outputs.next }}" "${GITHUB_SHA}"
          git push origin "${{ steps.version.outputs.next }}"
          gh release create "${{ steps.version.outputs.next }}" \
            --title "API ${{ steps.version.outputs.next }}" \
            --generate-notes \
            --notes "**Bump:** ${{ inputs.bump }} (from ${{ steps.version.outputs.latest }})
          **Image:** \`${{ env.IMAGE }}:${{ steps.version.outputs.next }}\` (linux/amd64, linux/arm64)
          **Chart:** \`oci://ghcr.io/${{ github.repository }}/charts/budget-api\` (chart version = release without the leading v)" \
            "${{ steps.chart.outputs.tgz }}"
