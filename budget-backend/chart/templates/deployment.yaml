apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "budget-api.fullname" . }}
  labels:
    {{- include "budget-api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "budget-api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "budget-api.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ .Values.secretEnv | toYaml | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        - name: wait-for-db
          image: {{ .Values.migrations.waitImage }}
          command:
            - sh
            - -c
            - until nc -z {{ include "budget-api.dbHost" . }} {{ include "budget-api.dbPort" . }}; do echo waiting for postgres; sleep 2; done
        - name: copy-migrations
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-c", "cp -r /root/migrations/. /work/"]
          volumeMounts:
            - name: migrations
              mountPath: /work
        - name: migrate
          image: {{ .Values.migrations.image }}
          command:
            - sh
            - -c
            - migrate -path /migrations -database "postgres://${PG_USER}:${PG_PASS}@${PG_HOST}:${PG_PORT}/${PG_DB}?sslmode=disable" up
          env:
            {{- include "budget-api.dbEnv" . | nindent 12 }}
          {{- if or .Values.existingSecret .Values.secretEnv }}
          envFrom:
            {{- if .Values.secretEnv }}
            - secretRef:
                name: {{ include "budget-api.fullname" . }}-env
            {{- end }}
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
          {{- end }}
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "budget-api.dbEnv" . | nindent 12 }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          {{- if or .Values.existingSecret .Values.secretEnv }}
          envFrom:
            {{- if .Values.secretEnv }}
            - secretRef:
                name: {{ include "budget-api.fullname" . }}-env
            {{- end }}
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ int .Values.env.PORT | default 8080 }}
          # Readiness checks /health (includes a DB ping) so traffic stops
          # when Postgres is unreachable; liveness stays TCP-only because
          # restarting the API cannot fix a down database.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.migrations.enabled }}
      volumes:
        - name: migrations
          emptyDir: {}
      {{- end }}
